<!DOCTYPE html>
<html lang="en" data-skin="vanilla">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeetsMusic — Color Reference</title>

  <!-- The real token sheets. This page is a pure color reference. -->
  <link rel="stylesheet" href="src/styles/fonts.css" />
  <link rel="stylesheet" href="src/styles/palette.css" />
  <link rel="stylesheet" href="src/styles/themes.css" />
  <link rel="stylesheet" href="src/styles/skin.css" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      background: #232427;
      color: #e8e8e8;
      font-family: var(--font-body, system-ui, sans-serif);
    }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: .04em; margin: 0 0 4px; }
    .lede { font-size: 13px; opacity: .55; margin: 0 0 32px; }

    .theme { margin-bottom: 40px; }
    .theme h2 {
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      opacity: .55; margin: 0 0 12px; font-weight: 600;
    }

    /* typography specimen — colors read true against the theme canvas */
    .specimen {
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 14px;
    }
    .specimen .t { font-family: var(--font-title); font-size: 26px; margin: 0 0 6px; }
    .specimen .x { font-family: var(--font-body); font-size: 14px; margin: 0 0 4px; }
    .specimen .s { font-family: var(--font-body); font-size: 12px; margin: 0; }

    /* role cards */
    .roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { background: #2f3033; border-radius: 8px; overflow: hidden; }
    .card .fill { height: 64px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .card .meta { padding: 8px 10px; }
    .card .role { font-size: 12px; font-weight: 600; font-family: ui-monospace, monospace; }
    .card .paint { font-size: 11px; opacity: .55; margin-top: 1px; }
    .card .hex { font-size: 11px; font-family: ui-monospace, monospace; opacity: .7; margin-top: 3px; }

    /* ── skins demo — live mini-mockups built from the real tokens ── */
    .pick { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .pick__btn {
      font: 600 12px/1 var(--font-body, system-ui, sans-serif);
      color: #e8e8e8; background: #2f3033; border: 1px solid transparent;
      border-radius: 999px; padding: 7px 14px; cursor: pointer;
      text-transform: capitalize;
    }
    .pick__btn.is-on { background: #45464b; border-color: rgba(255,255,255,.25); }

    .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .skinbox h3 {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      opacity: .55; margin: 0 0 8px; font-weight: 600;
    }

    /* Every value below is a live token — theme comes from the ancestor's
       data-theme, skin from this element's own data-skin. No literals. */
    .mock {
      background: var(--canvas);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-body);
    }
    .mock__bar {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--titlebar-h); padding: 0 12px;
    }
    .mock__title {
      font-family: var(--font-title); font-weight: var(--fw-title);
      font-size: var(--fs-title); color: var(--title);
      text-decoration-line: var(--title-underline);
      text-decoration-thickness: var(--title-underline-w);
      text-underline-offset: var(--title-underline-offset);
    }
    .mock__lights { display: flex; gap: var(--traffic-gap); }
    .light {
      width: var(--traffic-size); height: var(--traffic-size); border-radius: 50%;
      display: grid; place-items: center;
      font-size: var(--traffic-glyph-fs); line-height: 1; color: var(--traffic-glyph);
    }
    .mock__body {
      padding: var(--panel-pad);
      position: relative;           /* anchors the mock's ocean layer */
      background-image: var(--canvas-bg);
      background-size: var(--canvas-bg-size);
      background-repeat: var(--canvas-bg-repeat);
      animation: var(--canvas-anim);
    }
    /* Ocean layer — a scoped copy of the app's .ocean (src/styles.css), so
       the Ocean mock shows its actual surface and not a blank canvas. Pattern
       ids are suffixed per mock: two <pattern id="ocean-swell-1"> on one page
       would make every url(#…) resolve to the first. */
    .ocean {
      display: var(--ocean-display, none);
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .ocean__roll {
      x: -160px; y: -8px;
      width: calc(100% + 320px); height: calc(100% + 16px);
      animation: ocean-roll 16s linear infinite;
    }
    .ocean__bob  { animation: ocean-bob 9s ease-in-out infinite alternate; }
    .ocean__fill { fill: var(--canvas); }
    .ocean__crest { fill: none; stroke-width: 1px; }
    .ocean__crest--1 { stroke: var(--ocean-ink-1); }
    .ocean__crest--2 { stroke: var(--ocean-ink-2); }
    .ocean__crest--3 { stroke: var(--ocean-ink-3); }
    .ocean__roll--1 { --roll-dist: 144px; }
    .ocean__roll--2 { --roll-dist: 128px; }
    .ocean__roll--3 { --roll-dist:  80px; }
    .ocean__bob--1  { --bob-amp:  3px; }
    .ocean__bob--2  { --bob-amp: -2px; }
    .ocean__bob--3  { --bob-amp:  1px; }
    .mock__panel {
      position: relative; z-index: 1;   /* the card rides above the ocean layer */
      background: var(--panel);
      backdrop-filter: var(--panel-backdrop);
      border: var(--panel-border-width) solid var(--panel-border);
      border-radius: var(--panel-radius);
      padding: var(--panel-pad);
      box-shadow: var(--shadow-card);
    }
    .mock__ptitle {
      font-family: var(--font-title); font-weight: var(--fw-title);
      font-size: calc(var(--fs-title) * 0.8); color: var(--title);
      margin: 0 0 var(--space-2);
      text-decoration-line: var(--title-underline);
      text-decoration-thickness: var(--title-underline-w);
      text-underline-offset: var(--title-underline-offset);
    }
    .mock__pills { display: flex; gap: var(--space-2); margin: 0 0 var(--space-3); }
    .mpill {
      font-size: var(--fs-subtext); color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--lib-pill-radius); padding: 4px 12px;
    }
    .mock__text { font-size: var(--fs-text); color: var(--text); margin: 0 0 2px; }
    .mock__sub  { font-size: var(--fs-subtext); color: var(--subtext); margin: 0 0 var(--space-3); }
    .mscrub { position: relative; height: var(--scrubber-handle-size); display: flex; align-items: center; }
    .mscrub__track { width: 100%; height: var(--scrubber-track-h); background: var(--border); border-radius: 999px; }
    .mscrub__fill  { position: absolute; left: 0; width: 40%; height: var(--scrubber-track-h); background: var(--title); border-radius: 999px; }
    .mscrub__handle {
      position: absolute; left: 40%; transform: translateX(-50%);
      width: var(--scrubber-handle-size); height: var(--scrubber-handle-size);
      background: var(--title);
      -webkit-mask: var(--scrubber-handle) center / contain no-repeat;
      mask: var(--scrubber-handle) center / contain no-repeat;
    }
  </style>
</head>
<body>
  <h1>DeetsMusic — Color Reference</h1>
  <p class="lede">Every semantic role, per theme, read live from the token sheets — plus a live mini-mockup of every skin. Reference only — not the app.</p>
  <div id="root"></div>

  <script>
    const THEMES = ['lilac', 'green', 'sepia', 'moonlight', 'black-yellow', 'black-red'];
    const SKINS  = ['vanilla', 'press', 'ocean', 'glass', 'retro-future'];
    const K = ['lilac', 'green', 'sepia', 'moonlight', 'black-yellow', 'black-red'];
    // Paint names per role, in THEMES order.
    const ROLES = [
      ['--canvas',  ['Dewy Lilac', 'Dewy Chartreuse', 'Parchment', 'Deep Slate', 'Pitch', 'Pitch']],
      ['--go',      ['Fae Mint', 'Fern', 'Olive Leaf', 'Moonlight White', 'Hazard', 'Siren']],
      ['--stop',    ['Purple Cactus Flower', 'Foxglove', 'Terracotta', 'Moonlight Gray', 'Straw', 'Ember']],
      ['--pause',   ['Lemon Chrome', 'Lemon Chrome', 'Amber Glow', 'Moonlight Silver', 'Amber Wax', 'Blood']],
      ['--title',   ['Twilight Plum', 'Forest', 'Espresso', 'Slate Bright', 'Hazard', 'Siren']],
      ['--text',    ['Violet Slate', 'Moss', 'Cocoa', 'Slate Mid', 'Paper Warm', 'Ash White']],
      ['--subtext', ['Lavender Grey', 'Sage Grey', 'Faded Tan', 'Slate Dim', 'Straw', 'Ember']],
      ['--ink-2',   ['Cactus Flower (plate)', 'Foxglove (plate)', 'Terracotta (plate)', 'Silver (muted plate)', 'Hazard (plate)', 'Siren (plate)']],
    ].map(([role, list]) => [role, Object.fromEntries(K.map((t, i) => [t, list[i]]))]);

    const root = document.getElementById('root');
    for (const theme of THEMES) {
      const section = document.createElement('section');
      section.className = 'theme';
      section.setAttribute('data-theme', theme);

      // probe to read this theme's computed role values
      const cs = getComputedStyle(section);
      document.body.appendChild(section); // attach so computed styles resolve
      const val = (r) => getComputedStyle(section).getPropertyValue(r).trim();

      section.innerHTML = `<h2>Theme — ${theme}</h2>`;

      const spec = document.createElement('div');
      spec.className = 'specimen';
      spec.style.background = val('--canvas');
      spec.innerHTML =
        `<p class="t" style="color:${val('--title')}">Racing the title — DeetsMusic</p>
         <p class="x" style="color:${val('--text')}">Primary text. The readable body of the app, on canvas.</p>
         <p class="s" style="color:${val('--subtext')}">Subtext — the quiet metadata layer, on canvas.</p>`;
      section.appendChild(spec);

      const grid = document.createElement('div');
      grid.className = 'roles';
      for (const [role, names] of ROLES) {
        const v = val(role);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          `<div class="fill" style="background:${v}"></div>
           <div class="meta">
             <div class="role">${role}</div>
             <div class="paint">${names[theme]}</div>
             <div class="hex">${v.toUpperCase()}</div>
           </div>`;
        grid.appendChild(card);
      }
      section.appendChild(grid);
      root.appendChild(section);
    }

    // ── skins × themes — a live mini-mockup per skin; the picker retints
    //    all four at once by swapping data-theme on their shared parent.
    //    Everything inside .mock is driven by the real tokens.
    const skinsSection = document.createElement('section');
    skinsSection.className = 'theme';
    skinsSection.innerHTML = '<h2>Skins — every skin, any theme</h2>';

    const pick = document.createElement('div');
    pick.className = 'pick';
    const skinGrid = document.createElement('div');
    skinGrid.className = 'skin-grid';
    skinGrid.setAttribute('data-theme', THEMES[0]);

    for (const theme of THEMES) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pick__btn' + (theme === THEMES[0] ? ' is-on' : '');
      btn.textContent = theme;
      btn.addEventListener('click', () => {
        skinGrid.setAttribute('data-theme', theme);
        pick.querySelectorAll('.pick__btn').forEach((b) => b.classList.toggle('is-on', b === btn));
      });
      pick.appendChild(btn);
    }

    // One full sine period per tile (Q + T reflection) — value AND tangent
    // match at the tile edge, so the horizontal seam is invisible. Farthest
    // train first, each an opaque --canvas fill under a hairline crest.
    const SWELLS = [
      [3, 80, 46, 26, 4],
      [2, 64, 38, 22, 5],
      [1, 48, 30, 17, 6],
    ];
    const ocean = (skin) => {
      const crest = (W, c, a) => `M0 ${c} Q${W / 4} ${c - a} ${W / 2} ${c} T${W} ${c}`;
      const defs = SWELLS.map(([n, W, H, c, a]) => `
        <pattern id="ocean-swell-${n}-${skin}" width="${W}" height="${H}" patternUnits="userSpaceOnUse">
          <path class="ocean__fill" d="${crest(W, c, a)} L${W} ${H} L0 ${H} Z" />
          <path class="ocean__crest ocean__crest--${n}" d="${crest(W, c, a)}" />
        </pattern>`).join('');
      const trains = SWELLS.map(([n]) => `
        <g class="ocean__bob ocean__bob--${n}">
          <rect class="ocean__roll ocean__roll--${n}" fill="url(#ocean-swell-${n}-${skin})" />
        </g>`).join('');
      return `<svg class="ocean" aria-hidden="true"><defs>${defs}</defs>${trains}</svg>`;
    };

    for (const skin of SKINS) {
      const box = document.createElement('div');
      box.className = 'skinbox';
      box.innerHTML = `<h3>${skin}</h3>`;
      const mock = document.createElement('div');
      mock.className = 'mock';
      mock.setAttribute('data-skin', skin);
      mock.innerHTML =
        `<div class="mock__bar">
           <span class="mock__title">DeetsMusic</span>
           <span class="mock__lights">
             <span class="light" style="background:var(--go)">+</span>
             <span class="light" style="background:var(--pause)">&minus;</span>
             <span class="light" style="background:var(--stop)">&times;</span>
           </span>
         </div>
         <div class="mock__body">
           ${ocean(skin)}
           <div class="mock__panel">
             <p class="mock__ptitle">Library</p>
             <div class="mock__pills"><span class="mpill">Sort</span><span class="mpill">View</span></div>
             <p class="mock__text">Golden Hour — primary text</p>
             <p class="mock__sub">3:42 · subtext metadata</p>
             <div class="mscrub">
               <span class="mscrub__track"></span>
               <span class="mscrub__fill"></span>
               <span class="mscrub__handle"></span>
             </div>
           </div>
         </div>`;
      box.appendChild(mock);
      skinGrid.appendChild(box);
    }

    skinsSection.appendChild(pick);
    skinsSection.appendChild(skinGrid);
    root.appendChild(skinsSection);
  </script>
</body>
</html>
