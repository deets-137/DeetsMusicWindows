# The Mac playback probe (tools/mac-probe/README.md). One Tauri window on WKWebView that
# loads MusicKit JS and plays one song; with --glass, the Liquid Glass window test.
# Not part of the app; its own workspace and target.
[package]
name = "deets-mac-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` = production mode: the page is embedded and served at tauri://localhost,
# the origin a real Mac build would have. It also lets a plain `cargo build` work (no CLI).
# `macos-private-api` = a transparent window, so native glass can sit behind the page.
tauri = { version = "2", features = ["custom-protocol", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The glass test (src/glass.rs). The same versions Tauri already pulls in; no new download.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
  "NSResponder", "NSView", "NSGraphics", "NSGlassEffectView",
  "NSControl", "NSImageView", "NSImage", "NSCell",
] }
