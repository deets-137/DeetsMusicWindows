<!doctype html>
<html lang="en" data-theme="fairy" data-skin="vanilla">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>DeetsMusic</title>
    <!-- MusicKit JS — the in-webview playback engine (DRM via EME). Same build the
         loopback auth page loads. `player.ts` configures it lazily on first play. -->
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Custom frameless chrome. The middle .drag-region is the OS drag handle;
         the title (settings trigger) and lights opt out by not carrying it. -->
    <header class="titlebar">
      <div class="settings">
        <button
          class="app-title"
          id="settings-trigger"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >DeetsMusic</button>

        <div class="menu" id="settings-menu" role="menu" hidden>
          <div class="menu__row" data-row="theme">
            <span class="menu__label">Theme</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Theme">
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="fairy"     data-theme-choice="fairy">Fairy</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="sepia"     data-theme-choice="sepia">Sepia</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="moonlight" data-theme-choice="moonlight">Moonlight</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="hornet"    data-theme-choice="hornet">Hornet</button>
            </div>
          </div>

          <div class="menu__row" data-row="skin">
            <span class="menu__label">Skin</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Skin">
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="vanilla" data-skin-choice="vanilla">Vanilla</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="desk"    data-skin-choice="desk">Desk</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="ocean"   data-skin-choice="ocean">Ocean</button>
            </div>
          </div>

          <button class="menu__row menu__row--toggle" id="aot-toggle" type="button" role="menuitemcheckbox" aria-checked="false" data-row="aot">
            <span class="menu__label">Always on Top</span>
            <span class="menu__dot" aria-hidden="true"></span>
          </button>

          <div class="menu__row" data-row="account">
            <span class="menu__label">Account</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout flyout--account" role="menu" aria-label="Account">
              <div class="account">
                <button class="account__btn" id="account-action" type="button" data-state="out">
                  <span class="account__label">Apple Music</span>
                  <span class="account__icon" id="account-icon" aria-hidden="true"></span>
                </button>
                <div class="account__status" id="account-status">Not signed in</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="drag-region" data-tauri-drag-region></div>

      <div class="chrome-right">
        <!-- Volume: a level-filled pill that drops a vertical scrubber on hover.
             The pill's tinted fill mirrors the current volume; the panel hosts a
             mute toggle (speaker icon) above the vertical slider. -->
        <div class="vol" id="vol">
          <button
            class="vol__pill"
            id="vol-pill"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Volume"
          >
            <span class="vol__pill-fill" aria-hidden="true"></span>
            <span class="vol__pill-label">Vol.</span>
          </button>

          <div class="vol__panel" id="vol-panel" role="group" aria-label="Volume" hidden>
            <button class="vol__mute" id="vol-mute" type="button" aria-label="Mute" aria-pressed="false"></button>
            <div class="scrub scrub--v" id="vol-scrub">
              <div class="scrub__track"><div class="scrub__fill"></div></div>
              <span class="scrub__handle" aria-hidden="true"></span>
            </div>
          </div>
        </div>

        <div class="lights">
          <button class="light light--max" id="tl-max" type="button" aria-label="Maximize">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.6V8.4M1.6 5H8.4" /></svg>
        </button>
        <button class="light light--min" id="tl-min" type="button" aria-label="Minimize">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.6 5H8.4" /></svg>
        </button>
        <button class="light light--close" id="tl-close" type="button" aria-label="Close">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.3 2.3L7.7 7.7M7.7 2.3L2.3 7.7" /></svg>
        </button>
        </div>
      </div>
    </header>

    <main class="app-body">
      <div class="bento" data-screen="home">
        <!-- Now Playing — wide transport strip -->
        <section class="panel" data-card="now-playing" data-span="wide">
          <div class="np">
            <div class="np__art" id="np-art" aria-hidden="true">♪</div>
            <div class="np__center">
              <div class="np__meta">
                <span class="np__title" id="np-title">Not playing</span>
                <span class="np__artist" id="np-artist"></span>
              </div>
              <div class="np__scrub scrub">
                <div class="scrub__track"><div class="scrub__fill"></div></div>
                <span class="scrub__handle" aria-hidden="true"></span>
              </div>
              <div class="np__controls">
                <button class="np__btn" type="button" aria-label="Previous">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12h2V6zM20 6 10 12 20 18z" /></svg>
                </button>
                <button class="np__btn np__btn--play" id="np-playpause" type="button" aria-label="Play">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                </button>
                <button class="np__btn" type="button" aria-label="Next">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6 14 12 4 18zM16 6v12h2V6z" /></svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Library (left) -->
        <section class="panel" data-card="library">
          <header class="panel__head">
            <button class="panel__back" id="library-back" type="button" aria-label="Back" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            </button>
            <h2 class="panel__title">Library</h2>
            <button class="panel__action" id="library-refresh" type="button" aria-label="Refresh library">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
          </header>

          <!-- Toolbar (Sort/View/Search) + view are rendered by the collection-card
               engine into .coll-body, since the controls differ per context. -->
          <div class="coll-body"></div>
        </section>

        <!-- Playlists (right) -->
        <section class="panel" data-card="playlists">
          <header class="panel__head"><h2 class="panel__title">Playlists</h2></header>
          <div class="panel__body"></div>
        </section>
      </div>
    </main>
  </body>
</html>
