<!doctype html>
<html lang="en" data-theme="lilac" data-skin="press" data-surface="midi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Appearance pre-paint. The attributes above are the light-mode
         defaults; this resolves the REAL choice (saved id, retired-id
         migration, or the OS light/dark preference) before the stylesheet
         below is applied, so a dark-mode launch never flashes Lilac × Press.
         theme.ts / skin.ts own the same logic and re-apply it on load —
         keep the two RETIRED maps and the defaults in sync. -->
    <script>
      (function () {
        var R = {
          fairy: "lilac", glade: "green", hornet: "black-yellow", viper: "black-red",
          desk: "press", cyberstorm: "retro-future",
        };
        var dark = false;
        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
        [["deets.theme", "data-theme", dark ? "black-red" : "lilac"],
         ["deets.skin",  "data-skin",  dark ? "retro-future" : "press"]].forEach(function (a) {
          var saved = null;
          try { saved = localStorage.getItem(a[0]); } catch (e) {}
          document.documentElement.setAttribute(a[1], saved ? (R[saved] || saved) : a[2]);
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <title>DeetsMusic</title>
    <!-- Silence MusicKit's BLOCKING alert() for benign playback-transport races: an
         internal play() promise superseded by a queue swap (e.g. the second setQueue on a
         dead-catalog-id fallback, or a changeToMediaAtIndex jump) — the clicked song still
         plays, but MusicKit pops the abandoned promise as a modal dialog that freezes the
         transport. MUST run BEFORE musickit.js so the override is in place however MusicKit
         reaches alert (it can own the reference from load). Mirrors the unhandledrejection
         filter in player.ts (installMusicKitRejectionFilter); keep the two regexes in sync. -->
    <script>
      (function () {
        var BENIGN = /play\(\) (?:method was called without a previous stop\(\) or pause\(\)|request was interrupted by (?:a new load request|a call to pause\(\)))/i;
        // Every OTHER alert (MusicKit's "Unable to prepare for playback.", …) never
        // shows as a native dialog either: it goes to player.ts, which finds the cause
        // and raises the right toast (TOASTS.md §Apple health). Alerts that arrive before
        // player.ts loads wait in a small queue.
        window.__deetsMkAlerts = [];
        window.alert = function (message) {
          var msg = message == null ? "" : String(message);
          if (BENIGN.test(msg)) {
            console.debug("[player] swallowed benign MusicKit alert:", msg);
            return;
          }
          console.warn("[player] MusicKit alert → toast:", msg);
          if (typeof window.__deetsMkAlert === "function") window.__deetsMkAlert(msg);
          else if (window.__deetsMkAlerts.length < 5) window.__deetsMkAlerts.push(msg);
        };
      })();
    </script>
    <!-- MusicKit JS — the in-webview playback engine (DRM via EME). Same build the
         loopback auth page loads. `player.ts` configures it lazily on first play. -->
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Custom frameless chrome. The middle .drag-region is the OS drag handle;
         the title (settings trigger) and lights opt out by not carrying it. -->
    <header class="titlebar">
      <div class="settings">
        <button
          class="app-title"
          id="settings-trigger"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >DeetsMusic</button>

        <div class="menu" id="settings-menu" role="menu" hidden>
          <div class="menu__row" data-row="theme">
            <span class="menu__label">Theme</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Theme">
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="lilac"        data-theme-choice="lilac">Lilac</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="green"        data-theme-choice="green">Green</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="sepia"        data-theme-choice="sepia">Sepia</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="moonlight"    data-theme-choice="moonlight">Moonlight</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="black-yellow" data-theme-choice="black-yellow">Black &amp; Yellow</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="black-red"    data-theme-choice="black-red">Black &amp; Red</button>
            </div>
          </div>

          <div class="menu__row" data-row="skin">
            <span class="menu__label">Skin</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Skin">
              <!-- Vanilla is hidden from the picker (2026-09-10): its block is still the
                   [data-skin] base in skin.css and a saved "vanilla" still applies. -->
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="press"        data-skin-choice="press">Press</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="ocean"        data-skin-choice="ocean">Ocean</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="glass"        data-skin-choice="glass">Glass</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-skin="retro-future" data-skin-choice="retro-future">Retro-Future</button>
            </div>
          </div>

          <div class="menu__row" data-row="surface">
            <span class="menu__label">Surface</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Surface">
              <!-- Mini | NP (2026-09-14): one pill cut in two, the search pin idiom. Mini =
                   Now Playing + one card; NP = the player (Now Playing alone). -->
              <div class="flyout__item flyout__split" data-surface-choice-row="mini">
                <button class="flyout__half" type="button" role="menuitemradio" data-surface-choice="mini" data-mini-choice="cards">Mini</button>
                <button class="flyout__half" type="button" role="menuitemradio" data-surface-choice="mini" data-mini-choice="player" title="Now Playing only">NP</button>
              </div>
              <button class="flyout__item" type="button" role="menuitemradio" data-surface-choice="midi">Midi</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-surface-choice="max">Max</button>
            </div>
          </div>

          <!-- Everything else (Always on Top, Minimize to Tray, hover menus, Library Add,
               the Extension block, the playback/playlist preferences) lives in the
               Settings card (SETTINGS.md); this row summons it into a slot. -->
          <button class="menu__row menu__row--toggle" id="settings-open" type="button" role="menuitem" data-row="settings">
            <span class="menu__label">Settings…</span>
          </button>

          <div class="menu__row" data-row="account">
            <span class="menu__label">Account</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout flyout--account" role="menu" aria-label="Account">
              <div class="account">
                <button class="account__btn" id="account-action" type="button" data-state="out">
                  <span class="account__label">Apple Music</span>
                  <span class="account__icon" id="account-icon" aria-hidden="true"></span>
                </button>
                <div class="account__status" id="account-status">Not signed in</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="drag-region" data-tauri-drag-region></div>

      <div class="chrome-right">
        <!-- Volume: a level-filled pill that drops a vertical scrubber on hover.
             The pill's tinted fill mirrors the current volume; the panel hosts a
             mute toggle (speaker icon) above the vertical slider. -->
        <div class="vol" id="vol">
          <button
            class="vol__pill"
            id="vol-pill"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Volume"
          >
            <span class="vol__pill-fill" aria-hidden="true"></span>
            <span class="vol__pill-label">Vol.</span>
          </button>

          <div class="vol__panel" id="vol-panel" role="group" aria-label="Volume" hidden>
            <button class="vol__mute" id="vol-mute" type="button" aria-label="Mute" aria-pressed="false"></button>
            <div class="scrub scrub--v" id="vol-scrub">
              <div class="scrub__track"><div class="scrub__fill"></div></div>
              <span class="scrub__handle" aria-hidden="true"></span>
            </div>
            <!-- AirPlay (AIRPLAY.md): the "Play on" panel for mini/midi; max has the
                 same square on the stage volume row. CSS shows one per surface. -->
            <button class="vol__airplay ap-square" id="vol-airplay" type="button" aria-label="AirPlay" data-state="idle">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17a8 8 0 1 1 14 0" fill="none"></path><path d="M8 21l4-5 4 5z" fill="none"></path></svg>
            </button>
          </div>
        </div>

        <div class="lights">
          <button class="light light--max" id="tl-max" type="button" aria-label="Maximize">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.6V8.4M1.6 5H8.4" /></svg>
        </button>
        <button class="light light--min" id="tl-min" type="button" aria-label="Minimize">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.6 5H8.4" /></svg>
        </button>
        <button class="light light--close" id="tl-close" type="button" aria-label="Close">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.3 2.3L7.7 7.7M7.7 2.3L2.3 7.7" /></svg>
        </button>
        </div>
      </div>
    </header>

    <main class="app-body">
      <!-- Ambient layers (Ocean swell / Glass aurora / Retro-Future storm) sit BEHIND the
           cards and are inert (display:none) unless a skin opts in via its display token.
           All three animate ONLY transform and opacity on plain boxes, so the compositor
           moves finished layers and the main thread paints nothing per frame (an SVG child
           transform or a background-position repaints every frame: ~25–45% of a core idle).
           src/ambient.ts pauses them while the window cannot be seen. -->

      <!-- Ocean — three seamless wave trains. Each train is a bob <div> (rise and fall)
           around a roll <div> (drift), so the two transforms compose. The tile shapes
           (one full sine period each, so no seam) are SVG masks in src/styles.css: an
           opaque --canvas fill under a hairline crest, so a nearer swell occludes the ones
           behind it. Farthest (3) paints first. -->
      <div class="ocean" aria-hidden="true">
        <div class="ocean__bob ocean__bob--3"><div class="ocean__roll ocean__roll--3"></div></div>
        <div class="ocean__bob ocean__bob--2"><div class="ocean__roll ocean__roll--2"></div></div>
        <div class="ocean__bob ocean__bob--1"><div class="ocean__roll ocean__roll--1"></div></div>
      </div>

      <!-- Aurora — one <div> per blob, so each drifts on its own transform. -->
      <div class="aurora" aria-hidden="true">
        <div class="aurora__blob aurora__blob--1"></div>
        <div class="aurora__blob aurora__blob--2"></div>
        <div class="aurora__blob aurora__blob--3"></div>
      </div>

      <!-- Storm — each strike is a top→bottom wipe: the strike box slides down and clips,
           the hold box slides up by the same amount, so the bolt stays put while the clip
           reveals it. The paths carry no `d` — geometry is a skin token (CSS d: path(...)).
           Position is runtime (src/storm.ts). -->
      <div class="storm" aria-hidden="true">
        <div class="storm__strike storm__strike--1"><div class="storm__hold">
          <svg class="storm__svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="storm__bolt"></path></svg>
        </div></div>
        <div class="storm__strike storm__strike--2"><div class="storm__hold">
          <svg class="storm__svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="storm__bolt"></path></svg>
        </div></div>
      </div>

      <!-- Each .panel is a mount HOST. The layout manager (src/layout.ts) mounts a card into
           each slot from the persisted assignment; the two content slots are swappable via
           their title picker. Now Playing is anchored to the top slot. -->
      <div class="bento" data-screen="home">
        <section class="panel" data-slot="np" data-span="wide"></section>
        <section class="panel" data-slot="left"></section>
        <section class="panel" data-slot="right"></section>
        <!-- max-only hosts (hidden elsewhere): the anchored Queue under the stage, and two
             more content slots for the 2×2 bento. -->
        <section class="panel" data-slot="queue"></section>
        <section class="panel" data-slot="c"></section>
        <section class="panel" data-slot="d"></section>
      </div>
    </main>
  </body>
</html>
