[package]
name = "deetsmusic"
version = "0.6.0"
description = "A lightweight Apple Music player for Windows 11."
authors = ["Aditya Sundaram"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deetsmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# One instance only: the pinned taskbar button must activate the running app, not
# start a second process. The tray flyout runs with skip_taskbar, so Windows cannot
# match the pin to a window and would otherwise launch the exe again (TRAY.md).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] } # gzip: Apple compresses some replies (the playlist create) whatever we ask for
tiny_http = "0.12"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
# ms → RFC3339 for local playlists' date_added (already in the tree transitively)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# The AirPlay 2 sender (AIRPLAY.md), shared with the DeetsAirplay tray app, pinned to
# a commit of that public repo so a clone of this one builds alone. To change the crate:
# commit + push DeetsAirplay, then bump `rev` here. (For a long local iteration, a
# gitignored src-tauri/.cargo/config.toml `[patch]` to ../../DeetsAirplay/crates/airplay
# works, but it churns Cargo.lock — prefer push + bump.)
deets-airplay = { git = "https://github.com/deets-137/DeetsAirplay", rev = "4b3980b5b8c4265663319ca21da7568106f9dad3" }
tauri-plugin-deep-link = "2"
url = "2"
# Decodes a playlist cover's data URL for the cover:// link (PLAYLISTS.md §10.6).
# Already in the tree transitively, so no new crate download.
base64 = "0.22"
# The WebView2 settings interface that turns off browser keys (DRAG-DROP.md §6). The version
# Tauri's wry already uses, so no new crate download.
webview2-com = "0.38"
# The updater (RELEASE.md §6, update.rs): signed installers from music-api.deets.solutions/update.
tauri-plugin-updater = "2"

# OS bindings for the tray panel's Windows-media fallback (TRAY.md §3): the
# Global System Media Transport Controls session + the master volume endpoint;
# and our own media session (smtc.rs: `Media`). Already in the dependency tree
# transitively (Tauri), so no new crate downloads.
[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_WinRT",
]

