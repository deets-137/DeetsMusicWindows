[package]
name = "deetsmusic"
version = "0.1.0"
description = "A lightweight Apple Music player for Windows 11."
authors = ["Aditya Sundaram"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deetsmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
# ms → RFC3339 for local playlists' date_added (already in the tree transitively)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# OS bindings for the tray panel's Windows-media fallback (TRAY.md §3): the
# Global System Media Transport Controls session + the master volume endpoint.
# Already in the dependency tree transitively (Tauri), so no new crate downloads.
[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
]

