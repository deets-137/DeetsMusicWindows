[package]
name = "deetsmusic"
version = "0.14.6"
description = "A lightweight Apple Music player for Windows 11."
authors = ["Aditya Sundaram"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deetsmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads the Last.fm key file (docs/integrations/LASTFM.md §2). Already in the tree.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# One instance only: the pinned taskbar button must activate the running app, not
# start a second process. The tray flyout runs with skip_taskbar, so Windows cannot
# match the pin to a window and would otherwise launch the exe again (TRAY.md).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] } # gzip: Apple compresses some replies (the playlist create) whatever we ask for
tiny_http = "0.12"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] } # hooks + limits: the read-only query sandbox (query.rs, LOCAL-DATA.md §5)
futures = "0.3"
# ms → RFC3339 for local playlists' date_added (already in the tree transitively)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# The AirPlay 2 sender (AIRPLAY.md), shared with the DeetsAirplay tray app, pinned to
# a commit of that public repo so a clone of this one builds alone. To change the crate:
# commit + push DeetsAirplay, then bump `rev` here. (For a long local iteration, a
# gitignored src-tauri/.cargo/config.toml `[patch]` to ../../DeetsAirplay/crates/airplay
# works, but it churns Cargo.lock — prefer push + bump.)
deets-airplay = { git = "https://github.com/deets-137/DeetsAirplay", rev = "6fe2922c83d99658106c78ff68a16e04b53db5c1" }
tauri-plugin-deep-link = "2"
url = "2"
# Decodes a playlist cover's data URL for the cover:// link (PLAYLISTS.md §10.6).
# Already in the tree transitively, so no new crate download.
base64 = "0.22"
# The WebView2 settings interface that turns off browser keys (DRAG-DROP.md §6). The version
# Tauri's wry already uses, so no new crate download.
webview2-com = "0.38"
# The updater (RELEASE.md §6, update.rs): signed installers from music-api.deets.solutions/update.
tauri-plugin-updater = "2"
# Last.fm signs every call with MD5 (docs/integrations/LASTFM.md §3). One small crate on the digest 0.10
# family sha2 already brings.
md-5 = "0.10"

# Friends identity (docs/integrations/FRIENDS.md §2). The friend code is the public half of an Ed25519
# key pair, so the worker can check that a socket is really you WITHOUT holding anything
# secret of yours — the property that keeps "the worker stores no secrets" true. Workers'
# own WebCrypto verifies Ed25519 natively, so there is nothing to ship on the server side.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
# The friend code is SHA-256(public key) in Crockford base32. Already in the tree through
# the digest family; naming it here makes it a direct dependency rather than a lucky one.
sha2 = "0.10"

# OS bindings for the tray panel's Windows-media fallback (TRAY.md §3): the
# Global System Media Transport Controls session + the master volume endpoint;
# and our own media session (smtc.rs: `Media`). Already in the dependency tree
# transitively (Tauri), so no new crate downloads.
# `#[implement]` (audio_out.rs: the Windows audio notices) names this crate at its root.
# Already in the tree through `windows`; no new download.
[dependencies.windows-core]
version = "0.61"

[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # DPAPI for the Song of the Day outlet secrets (docs/integrations/DeetsOTD.md §8.15). A feature of the
  # `windows` crate the app already has; no new download.
  "Win32_Security_Cryptography",
  # The Discord Rich Presence pipe (docs/integrations/FRIENDS.md §8.11). Overlapped named-pipe I/O, so
  # a wedged Discord client can never hold a thread: Storage_FileSystem = CreateFileW /
  # ReadFile / WriteFile, System_Pipes = WaitNamedPipeW, System_IO = OVERLAPPED and
  # CancelIoEx, System_Threading = the event each call waits on. All four are features of
  # the `windows` crate the app already has; no new download.
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell_PropertiesSystem",
]

